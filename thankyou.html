  <title>INFORM — You're in.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;800&family=Doto:wght@700&family=VT323&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:    #000000;
      --white:  #FFFFFF;
      --orange: #E85028;
      --muted:  #5E5E5A;
    }

    html, body {
      background: var(--ink);
      color: var(--white);
      min-height: 100dvh;
      font-family: 'Geist', sans-serif;
    }

    #page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px clamp(24px, 5vw, 60px) 48px;
    }

    #page .content-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* ── Header ── */
    header {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 8px 0 0;
    }

    .header-logo { width: 165px; display: block; }
    .header-logo svg { width: 100%; height: auto; display: block; }

    /* ── Content ── */
    .content {
      width: 100%;
      max-width: 560px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.45s forwards;
    }

    .label {
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: var(--orange);
      letter-spacing: 0.15em;
    }

    h1 {
      font-family: 'Geist', sans-serif;
      font-weight: 700;
      font-size: clamp(32px, 5vw, 52px);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    p {
      font-family: 'Geist', sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--muted);
      max-width: 420px;
    }

    .ig-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 14px 32px;
      border: 1px solid var(--white);
      color: var(--white);
      font-family: 'Doto', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .ig-btn:hover {
      background: var(--white);
      color: var(--ink);
    }
    .ig-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .home-link {
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .home-link:hover { color: var(--white); }

    /* ── Animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile ── */
    @media (max-width: 767px) {
      .content { gap: 16px; }
      h1 { font-size: 28px; }
      p { font-size: 15px; }
      .header-logo { width: 120px; }
    }
  </style>
</head>
